name: CI

# Solo en PRs: correr otra vez al fusionar en dev repetía lo mismo y duplicaba los minutos. Un cambio
# que solo toca documentación no corre el CI, y un push nuevo cancela la corrida anterior del mismo PR.
on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for Sonar blame/history analysis

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Genera coverage/lcov.info, que el análisis de SonarCloud usa para medir la cobertura.
      - name: Test with coverage
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      # publint y arethetypeswrong: validan package.json, exports y tipos tal como se publicarían.
      - name: Check package
        run: pnpm run check:package

      # La documentación solo se publica como artefacto en los PRs de release a main.
      - name: Generate docs
        if: github.base_ref == 'main'
        run: pnpm run docs

      - name: Upload docs artifact
        if: github.base_ref == 'main'
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs
          retention-days: 14

      # El scanner de Sonar descarga su JRE y sus analizadores en cada corrida (~300 MB): se guardan entre corridas.
      - name: Cache Sonar
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Requires the SONAR_TOKEN repo secret and Automatic Analysis disabled in Sonar
      # (Administration -> Analysis Method -> keep only CI-based Analysis).
      - name: SonarQube Cloud scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
